[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-mobile-robot-simulation"
version = "0.1.0"
description = "Differential-drive kinematics, encoder odometry, and waypoint tracking simulation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
